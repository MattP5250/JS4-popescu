<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="text-center bg-warning">
        <h1 class="text-center display-3 mx-auto">SCRIPT JAVASCRIPT</h1>
        <p class="fs-5">una collezione di script javascript</p>
    </div>
    <div class="row text-center">
        <div class="col">
            <h3>COSA FA LO SCRIPT</h3>
            <img src="/images/JqxsAtj7G5bc4D8vfE5LKrGjLhm2dgYi7aRtEXBd.jpg" class="" alt="">
            <p>inserisci un numero e lo script calcolera i divisori</p>
        </div>
        <div class="col">
            <h3>IL TUO INPUT</h3>
            <form>
                <input type="number" id="input" placeholder="inserisci numero">
                 <button type="button" class="btn btn-outline-secondary" onclick="divisori()"  >Calcola</button>
            </form>
           
        </div>
        <div class="col">
            <H3>IL RISULTATO</H3>
            <p id="risultato">      </p>
        </div>
    </div>
    
    <script src="/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
